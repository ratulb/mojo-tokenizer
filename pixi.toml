[workspace]
name = "mojo-tokenizer"
version = "0.1.0"
description = "Pure Mojo tokenizer for LLM inference - BPE, tiktoken, HuggingFace compatible"
authors = ["Atsentia"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[package]
name = "mojo-tokenizer"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-mojo", version = "*" }

[package.host-dependencies]
mojo-compiler = "=0.26.2"

[package.build-dependencies]
mojo-compiler = "=0.26.2"

[package.run-dependencies]
mojo-compiler = "=0.26.2"

[dependencies]
mojo-compiler = "=0.26.2"
mojo = "==0.26.2"

[tasks]
test    = "mojo run -I lib tests/test_tokenizer.mojo"
#build   = "mojo package src -o lib/mojo_tokenizer.mojopkg"
format  = "mojo format src/"
example = "mojo run examples/basic_usage.mojo"
